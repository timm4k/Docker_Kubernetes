apiVersion: v1
kind: Pod
metadata:
  name: oom-practice
spec:
  restartPolicy: Never
  containers:
    - name: memory-hog
      image: polinux/stress:latest
      command: ["stress", "--vm", "1", "--vm-bytes", "150M", "--timeout", "15s"]
      resources:
        limits:
          memory: "50Mi"
          cpu: "200m"
        requests:
          memory: "25Mi"
          cpu: "100m"
