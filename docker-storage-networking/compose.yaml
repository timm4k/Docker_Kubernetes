name: storage-networking

services:
  postgres:
    image: postgres:17-alpine
    profiles: [storage]
    environment:
      POSTGRES_USER: coursework
      POSTGRES_DB: storage_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database-network]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coursework -d storage_demo]
      interval: 2s
      timeout: 3s
      retries: 30

  development:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    profiles: [development]
    ports:
      - 127.0.0.1:${DEV_PORT:-5001}:5000
    volumes:
      - ./api:/src
      - dev-bin:/src/bin
      - dev-obj:/src/obj

  namespace-probe:
    image: alpine:3.23
    profiles: [namespaces]
    command: [ip, addr, show]

  web:
    image: nginx:alpine
    profiles: [dns]
    networks: [test-network]

  dns-probe:
    image: alpine:3.23
    profiles: [dns]
    depends_on: [web]
    networks: [test-network]
    command: [sh, -c, 'nslookup web && ping -c 3 web && wget -qO- http://web']

  port-web:
    image: nginx:alpine
    profiles: [ports]
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:80

  backend:
    image: kennethreitz/httpbin
    profiles: [app]
    networks: [app-network]

  frontend:
    image: nginx:alpine
    profiles: [app]
    depends_on: [backend]
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8080}:80
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [app-network]

  troubleshooting:
    build: ./api
    profiles: [troubleshooting]
    environment:
      ASPNETCORE_URLS: ${API_URLS:-http://0.0.0.0:5000}
    ports:
      - 127.0.0.1:${API_PORT:-5000}:5000

volumes:
  postgres-data:
    name: postgres-data
  dev-bin:
  dev-obj:

networks:
  database-network:
    internal: true
  test-network:
    name: test-network
    driver: bridge
  app-network:
    name: app-network
    driver: bridge
